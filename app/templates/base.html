<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Fedishare{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <header class="border-b border-zinc-800 sticky top-0 bg-zinc-950/95 backdrop-blur">
      <nav class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/" class="font-semibold text-xl tracking-wide">Fedishare</a>
        <div class="flex items-center gap-4 text-sm">
          <a href="/explore" class="text-zinc-300 hover:text-white">Explore</a>
          <a href="/about" class="text-zinc-300 hover:text-white">Federation</a>
          {% if current_user %}
          <a href="/upload" class="text-zinc-300 hover:text-white">Upload</a>
          <a href="/u/{{ current_user.username }}" class="text-zinc-300 hover:text-white">@{{ current_user.username }}</a>
          <form action="/logout" method="post" class="inline">
            <button class="bg-zinc-800 hover:bg-zinc-700 rounded px-3 py-1">Logout</button>
          </form>
          {% else %}
          <a href="/login" class="text-zinc-300 hover:text-white">Login</a>
          <a href="/register" class="bg-violet-600 hover:bg-violet-500 rounded px-3 py-1">Join</a>
          {% endif %}
        </div>
      </nav>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
